<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog App - Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">My Blog App</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="form-container">
                <h2 id="form-title">Login</h2>
                
                <div id="message-container"></div>

                <!-- Login Form -->
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="hidden">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" name="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input type="password" id="register-confirm-password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn">Register</button>
                </form>

                <div style="margin-top: 1rem; text-align: center;">
                    <a href="#" id="toggle-form">Need an account? Register here</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 My Blog App. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const formTitle = document.getElementById('form-title');
        const toggleFormLink = document.getElementById('toggle-form');
        const messageContainer = document.getElementById('message-container');

        // Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const isRegister = urlParams.get('register') === 'true';

        if (isRegister) {
            showRegisterForm();
        }

        // Toggle between login and register
        toggleFormLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (loginForm.classList.contains('hidden')) {
                showLoginForm();
            } else {
                showRegisterForm();
            }
        });

        function showLoginForm() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            formTitle.textContent = 'Login';
            toggleFormLink.textContent = 'Need an account? Register here';
        }

        function showRegisterForm() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            formTitle.textContent = 'Register';
            toggleFormLink.textContent = 'Already have an account? Login here';
        }

        // Handle login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const result = await login(username, password);
            
            if (result.success) {
                showLocalMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showLocalMessage(result.message, 'error');
            }
        });

        // Handle registration
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            const result = await register(username, email, password, confirmPassword);
            
            if (result.success) {
                showLocalMessage('Registration successful! Please login.', 'success');
                setTimeout(() => {
                    showLoginForm();
                    registerForm.reset();
                }, 1500);
            } else {
                showLocalMessage(result.message, 'error');
            }
        });

        function showLocalMessage(message, type) {
            messageContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        // Redirect if already logged in
        setTimeout(() => {
            if (currentUser) {
                window.location.href = 'index.html';
            }
        }, 500);
    </script>
</body>
</html>
